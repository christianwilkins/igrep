name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  python-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: igrep-linux-amd64
            exe_name: igrep
          - os: macos-latest
            artifact_name: igrep-macos-amd64
            exe_name: igrep
          - os: windows-latest
            artifact_name: igrep-windows-amd64
            exe_name: igrep.exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build standalone binary
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --onefile --name igrep -m igrep

      - name: Prepare archive (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p out
          cp dist/${{ matrix.exe_name }} out/${{ matrix.exe_name }}
          chmod +x out/${{ matrix.exe_name }}
          tar -czf ${{ matrix.artifact_name }}.tar.gz -C out ${{ matrix.exe_name }}

      - name: Prepare archive (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out -Force | Out-Null
          Copy-Item dist/${{ matrix.exe_name }} out/${{ matrix.exe_name }}
          Compress-Archive -Path out/${{ matrix.exe_name }} -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            *.tar.gz
            *.zip

  github-release:
    needs: [python-dist, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
